# Server deploy (dev + prod): Traefik + image from Nexus. PUBLIC_HOST comes from CI .env.
# Not for a local machine. Set PUBLIC_HOST before the first deploy.

services:
  fort:
    image: vortex.kronshtadt.ru:8443/maas-hosted/fort:latest
    container_name: fort
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
    networks:
      - traefik-global-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-global-proxy"
      - "traefik.http.routers.fort.rule=Host(`${PUBLIC_HOST:-fort.example.com}`)"
      - "traefik.http.routers.fort.entrypoints=https"
      - "traefik.http.routers.fort.tls=true"
      - "traefik.http.services.fort.loadbalancer.server.port=80"
      - "traefik.http.services.fort.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.fort.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.middlewares.fort-headers.headers.customresponseheaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.fort-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.fort-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.fort-headers.headers.customresponseheaders.Strict-Transport-Security=max-age=31536000; includeSubDomains"
      - "traefik.http.routers.fort.middlewares=fort-headers,cors@file"

networks:
  traefik-global-proxy:
    external: true
